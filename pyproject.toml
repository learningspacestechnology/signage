[project]
name = "advertising"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==4.2.29",
    "django-admin-ordering==0.20.0",
    "django-cleanup==9.0.0",
    "django-unfold==0.82.0",
    "celery[redis]==5.3.6",
    # kombu 5.7 requires `packaging` only through its own `redis` extra, which
    # celery 5.3.6's `[redis]` never requests: a lock with kombu 5.7 has no
    # `packaging`, so the Redis transport fails to import and the worker and
    # beat die at startup. Tests run Celery eagerly and would not notice. Lift
    # this only alongside a Celery upgrade, after starting a worker on Redis.
    "kombu<5.7",
    "django-celery-beat==2.5.0",
    "django-celery-results==2.6.0",
    "django-recurrence==1.14",
    "httplib2==0.31.2",
    "httpx==0.27.2",
    "msal>=1.28.0",
    "pillow==12.1.1",
    "markdown>=3.10.2",
    # Every outbound HTTPS call (httpx, msal via requests, httplib2) verifies
    # against certifi's bundle, not the OS store. Direct, with a floor, so no
    # relock can fall back below the eMudhra-distrusting bundle (Oct 2026).
    # Production goes further than the lock: the deploy Dockerfile installs
    # uv.lock's pins, then upgrades certifi alone to its newest release on
    # every update. The locked version is what dev and the tests run.
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.61.0",
    "time-machine==3.2.0",
]
runtime = [
    "mysqlclient==2.2.0",
    "uwsgi"
]
